<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Gateway - Verification Required</title>
    
    <!-- Load hCaptcha Integration Script -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>

    <style>
        body {
            font-family: monospace;
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .gateway-box {
            background: #111827;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #1f2937;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .captcha-wrapper {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            min-height: 80px;
        }
        .btn-proceed {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            display: none;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
            transition: background-color 0.2s;
        }
        .btn-proceed:hover { background-color: #b91c1c; }
        .status-msg { 
            color: #9ca3af; 
            font-size: 13px; 
            margin-bottom: 20px;
            line-height: 1.5;
        }
        h1 { color: #f3f4f6; font-size: 24px; margin-bottom: 5px; letter-spacing: -0.5px; }

        /* Hide the mCaptcha authorization token input field */
        #mcaptcha__token-label {
            display: none;
        }
    </style>
</head>
<body>

<div class="gateway-box">
    <h1>SECURITY CLEARANCE</h1>
    <p id="statusMsg" class="status-msg">Please complete both verification challenges below.</p>

    <!-- 1. mCaptcha Form Elements (Per Official Docs) -->
    <div class="captcha-wrapper">
        <label 
            data-mcaptcha_url="https://demo.mcaptcha.org/widget/?sitekey=tyBV0DQvnaMsiio8cKtCTKf1oT3F1ELx" 
            for="mcaptcha__token" 
            id="mcaptcha__token-label">
            <input type="text" name="mcaptcha__token" id="mcaptcha__token" />
        </label>
        <div id="mcaptcha__widget-container"></div>
    </div>

    <!-- 2. hCaptcha Box -->
    <div class="captcha-wrapper">
        <div class="h-captcha" 
             data-sitekey="0434871e-cc70-4460-bbb4-00e6bc7204fa" 
             data-callback="onHCaptchaVerified">
        </div>
    </div>

    <!-- Proceed Button -->
    <button id="entryBtn" class="btn-proceed" onclick="forwardUser()">Access Approved: Enter Site</button>
</div>

<!-- Load mCaptcha Vanilla Glue Script at end of body -->
<script src="https://unpkg.com/@mcaptcha/vanilla-glue@0.1.0-rc2/dist/index.js"></script>

<script>
    let mcaptchaToken = "";
    let hcaptchaToken = "";

    // Monitor mCaptcha token generation automatically
    setInterval(() => {
        const tokenInput = document.getElementById("mcaptcha__token");
        if (tokenInput && tokenInput.value && !mcaptchaToken) {
            mcaptchaToken = tokenInput.value;
            evaluateAccessRules();
        }
    }, 300);

    // Callback fired when hCaptcha completes
    function onHCaptchaVerified(token) {
        hcaptchaToken = token;
        evaluateAccessRules();
    }

    // Evaluate token presence and reveal entry button
    function evaluateAccessRules() {
        const statusMsg = document.getElementById("statusMsg");
        const entryBtn = document.getElementById("entryBtn");

        if (mcaptchaToken && !hcaptchaToken) {
            statusMsg.innerText = "mCaptcha verified ✓. Please complete hCaptcha.";
            statusMsg.style.color = "#3b82f6";
        } else if (!mcaptchaToken && hcaptchaToken) {
            statusMsg.innerText = "hCaptcha verified ✓. Please complete mCaptcha.";
            statusMsg.style.color = "#3b82f6";
        } else if (mcaptchaToken && hcaptchaToken) {
            statusMsg.innerText = "All security challenges passed ✓";
            statusMsg.style.color = "#10b981";
            entryBtn.style.display = "block";
        }
    }

    function forwardUser() {
        const targetUrl = "https://hindhokla-os.netlify.app/";
        window.location.href = `${targetUrl}?m_token=${encodeURIComponent(mcaptchaToken)}&h_token=${encodeURIComponent(hcaptchaToken)}`;
    }
</script>

</body>
</html>
