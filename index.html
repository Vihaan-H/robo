<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Gateway - Quadruple Verification</title>
    
    <!-- Load hCaptcha Integration Script -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>

    <!-- Load Friendly Captcha Scripts -->
    <script type="module" src="https://unpkg.com/friendly-challenge@0.9.8/widget.module.min.js" async defer></script>
    <script nomodule src="https://unpkg.com/friendly-challenge@0.9.8/widget.min.js" async defer></script>

    <style>
        body {
            font-family: monospace;
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 20px 0;
        }
        .gateway-box {
            background: #111827;
            padding: 30px 40px;
            border-radius: 12px;
            border: 2px solid #1f2937;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .captcha-wrapper {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .btn-proceed {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            display: none;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
            transition: background-color 0.2s;
        }
        .btn-proceed:hover { background-color: #b91c1c; }
        .status-msg { 
            color: #9ca3af; 
            font-size: 13px; 
            margin-bottom: 20px;
            line-height: 1.5;
        }
        h1 { color: #f3f4f6; font-size: 24px; margin-bottom: 5px; letter-spacing: -0.5px; }

        /* Canvas CAPTCHA Styles */
        #matrixCanvas {
            border: 1px dashed #374151;
            background: #1f2937;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .matrix-input {
            width: 80%;
            padding: 8px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            font-size: 15px;
            font-family: monospace;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 8px;
        }
        .matrix-input:focus {
            outline: 1px solid #dc2626;
        }
        .matrix-btn {
            background: #374151;
            color: #e2e8f0;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 4px;
            font-family: monospace;
        }
        .matrix-btn:hover {
            background: #4b5563;
        }
        #mcaptcha__token-label {
            display: none;
        }
    </style>
</head>
<body>

<div class="gateway-box">
    <h1>SECURITY CLEARANCE</h1>
    <p id="statusMsg" class="status-msg">Please complete all 4 security challenges below.</p>

    <!-- 1. Visual Canvas Math Challenge -->
    <div class="captcha-wrapper">
        <canvas id="matrixCanvas" width="280" height="80"></canvas>
        <input type="text" id="captchaInput" class="matrix-input" placeholder="Solve math challenge" autocomplete="off">
        <button type="button" class="matrix-btn" onclick="generateHardMatrix()">Regenerate Challenge</button>
    </div>

    <!-- 2. mCaptcha Challenge -->
    <div class="captcha-wrapper">
        <label 
            data-mcaptcha_url="https://demo.mcaptcha.org/widget/?sitekey=tyBV0DQvnaMsiio8cKtCTKf1oT3F1ELx" 
            for="mcaptcha__token" 
            id="mcaptcha__token-label">
            <input type="text" name="mcaptcha__token" id="mcaptcha__token" />
        </label>
        <div id="mcaptcha__widget-container"></div>
    </div>

    <!-- 3. Friendly Captcha Box -->
    <div class="captcha-wrapper">
        <div class="frc-captcha" 
             data-sitekey="FCMPIBVD0T9CPL74" 
             data-callback="onFriendlyCaptchaVerified">
        </div>
    </div>

    <!-- 4. hCaptcha Box -->
    <div class="captcha-wrapper">
        <div class="h-captcha" 
             data-sitekey="0434871e-cc70-4460-bbb4-00e6bc7204fa" 
             data-callback="onHCaptchaVerified">
        </div>
    </div>

    <!-- Entry Execution Link -->
    <button id="entryBtn" class="btn-proceed" onclick="forwardUser()">Access Approved: Enter Site</button>
</div>

<!-- Load mCaptcha Vanilla Glue Script -->
<script src="https://unpkg.com/@mcaptcha/vanilla-glue@0.1.0-rc2/dist/index.js"></script>

<script>
    let mcaptchaToken = "";
    let hcaptchaToken = "";
    let friendlyToken = "";
    let canvasVerified = false;
    let secureTargetValue = null;

    // --- 1. Visual Canvas CAPTCHA Generator ---
    function generateHardMatrix() {
        const canvas = document.getElementById("matrixCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Background noise grid
        for (let x = 0; x < canvas.width; x += 15) {
            ctx.strokeStyle = `rgba(${Math.random()*100}, ${Math.random()*255}, ${Math.random()*100}, 0.25)`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        
        // Equation variables
        const valA = Math.floor(Math.random() * 25) + 11; 
        const valB = Math.floor(Math.random() * 9) + 2;   
        secureTargetValue = valA + valB;
        const challengeText = `${valA} + ${valB} = ?`;

        // Interruption lines
        for (let i = 0; i < 10; i++) {
            ctx.strokeStyle = `rgb(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)})`;
            ctx.beginPath();
            ctx.lineWidth = Math.random() * 2 + 1;
            ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.stroke();
        }

        // Render distorted glyphs
        ctx.font = "bold 28px Courier New";
        ctx.textBaseline = "middle";

        let startX = 30;
        for (let char of challengeText) {
            ctx.save();
            let randomY = 40 + (Math.random() * 12 - 6);
            ctx.translate(startX, randomY);
            let randomAngle = (Math.random() * 30 - 15) * Math.PI / 180;
            ctx.rotate(randomAngle);
            
            ctx.fillStyle = `rgb(${Math.random()*100},${Math.random()*100},${Math.random()*255})`;
            ctx.fillText(char, 2, 2);
            
            ctx.fillStyle = "#ffffff";
            ctx.fillText(char, 0, 0);
            ctx.restore();
            startX += 24;
        }

        // Foreground noise dots
        for (let i = 0; i < 120; i++) {
            ctx.fillStyle = `rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
            ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
        }

        // Reset status on redraw
        canvasVerified = false;
        document.getElementById("captchaInput").value = "";
        evaluateAccessRules();
    }

    // Input listener for Canvas CAPTCHA
    document.getElementById("captchaInput").addEventListener("input", function(e) {
        const userVal = parseInt(e.target.value.trim(), 10);
        canvasVerified = (userVal === secureTargetValue);
        evaluateAccessRules();
    });

    // --- 2. mCaptcha Token Monitor ---
    setInterval(() => {
        const tokenInput = document.getElementById("mcaptcha__token");
        if (tokenInput && tokenInput.value && !mcaptchaToken) {
            mcaptchaToken = tokenInput.value;
            evaluateAccessRules();
        }
    }, 300);

    // --- 3. Friendly Captcha Callback ---
    function onFriendlyCaptchaVerified(solution) {
        friendlyToken = solution;
        evaluateAccessRules();
    }

    // --- 4. hCaptcha Callback ---
    function onHCaptchaVerified(token) {
        hcaptchaToken = token;
        evaluateAccessRules();
    }

    // --- 5. Central Evaluator ---
    function evaluateAccessRules() {
        const statusMsg = document.getElementById("statusMsg");
        const entryBtn = document.getElementById("entryBtn");

        const completedCount = [canvasVerified, !!mcaptchaToken, !!friendlyToken, !!hcaptchaToken].filter(Boolean).length;

        if (completedCount === 4) {
            statusMsg.innerText = "All security challenges passed ✓";
            statusMsg.style.color = "#10b981";
            entryBtn.style.display = "block";
        } else {
            entryBtn.style.display = "none";
            statusMsg.innerText = `Progress: ${completedCount}/4 challenges completed.`;
            statusMsg.style.color = "#9ca3af";
        }
    }

    function forwardUser() {
        const targetUrl = "https://hindhokla-os.netlify.app/";
        window.location.href = `${targetUrl}?m_token=${encodeURIComponent(mcaptchaToken)}&h_token=${encodeURIComponent(hcaptchaToken)}&f_token=${encodeURIComponent(friendlyToken)}&math_v=passed`;
    }

    // Initialize Canvas on Load
    window.onload = generateHardMatrix;
</script>

</body>
</html>
