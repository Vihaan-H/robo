<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Gateway - Verification Required</title>
    
    <!-- Load hCaptcha Script -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>

    <style>
        body {
            font-family: monospace;
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .gateway-box {
            background: #111827;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #1f2937;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .captcha-wrapper {
            margin: 25px 0;
            display: flex;
            justify-content: center;
        }
        .btn-proceed {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            display: none;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
            transition: background-color 0.2s;
        }
        .btn-proceed:hover { background-color: #b91c1c; }
        .status-msg { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        h1 { color: #f3f4f6; font-size: 24px; margin-bottom: 5px; letter-spacing: -0.5px; }
        iframe.mcaptcha-frame {
            border: none;
            width: 300px;
            height: 78px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="gateway-box">
    <h1>SECURITY CLEARANCE</h1>
    <p class="status-msg">Compute verification and manual verification required to pass.</p>

    <!-- 1. Native mCaptcha Frame -->
    <div class="captcha-wrapper">
        <iframe 
            class="mcaptcha-frame"
            id="mcaptcha-iframe"
            src="https://mcaptcha.org/widget/?sitekey=tyBV0DQvnaMsiio8cKtCTKf1oT3F1ELx"
            title="mCaptcha Verification">
        </iframe>
    </div>

    <!-- 2. hCaptcha Box -->
    <div class="captcha-wrapper">
        <div class="h-captcha" 
             data-sitekey="0434871e-cc70-4460-bbb4-00e6bc7204fa" 
             data-callback="onHCaptchaVerified">
        </div>
    </div>

    <!-- Proceed Button -->
    <button id="entryBtn" class="btn-proceed" onclick="forwardUser()">Access Approved: Enter Site</button>
</div>

<script>
    let mcaptchaToken = "";
    let hcaptchaToken = "";

    // Listen for mCaptcha token broadcasted via cross-document postMessage
    window.addEventListener('message', (event) => {
        // Validate origin matches the instance domain
        if (event.origin === "https://mcaptcha.org") {
            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                
                // Read verification token from postMessage payload
                if (data && (data.token || data.mcaptcha_token)) {
                    mcaptchaToken = data.token || data.mcaptcha_token;
                    evaluateAccessRules();
                }
            } catch (err) {
                // Ignore irrelevant messages
            }
        }
    });

    // Callback fired when hCaptcha completes
    function onHCaptchaVerified(token) {
        hcaptchaToken = token;
        evaluateAccessRules();
    }

    // Show button only when both verification checks pass
    function evaluateAccessRules() {
        if (mcaptchaToken && hcaptchaToken) {
            const entryBtn = document.getElementById("entryBtn");
            const statusMsg = document.querySelector(".status-msg");
            
            if (entryBtn) entryBtn.style.display = "block";
            if (statusMsg) {
                statusMsg.innerText = "All security challenges passed.";
                statusMsg.style.color = "#10b981";
            }
        }
    }

    // Redirect to destination URL carrying both tokens as parameters
    function forwardUser() {
        const targetUrl = "https://hindhokla-os.netlify.app/";
        window.location.href = `${targetUrl}?m_token=${encodeURIComponent(mcaptchaToken)}&h_token=${encodeURIComponent(hcaptchaToken)}`;
    }
</script>

</body>
</html>
