<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Gateway - Verification Required</title>
    
    <!-- Load hCaptcha Integration Script -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    
    <!-- Load mCaptcha Vanilla Glue Script -->
    <script src="https://unpkg.com/@mcaptcha/vanilla-glue@latest/dist/index.js" defer></script>

    <style>
        body {
            font-family: monospace;
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .gateway-box {
            background: #111827;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #1f2937;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .captcha-wrapper {
            margin: 25px 0;
            display: flex;
            justify-content: center;
        }
        .btn-proceed {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            display: none;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
            transition: background-color 0.2s;
        }
        .btn-proceed:hover { background-color: #b91c1c; }
        .status-msg { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        h1 { color: #f3f4f6; font-size: 24px; margin-bottom: 5px; letter-spacing: -0.5px; }
    </style>
</head>
<body>

<div class="gateway-box">
    <h1>SECURITY CLEARANCE</h1>
    <p class="status-msg">Compute verification and manual verification required to pass.</p>

    <!-- 1. mCaptcha Box (Container for auto-injection) -->
    <div class="captcha-wrapper" id="mcaptcha-container"></div>

    <!-- 2. hCaptcha Box -->
    <div class="captcha-wrapper">
        <div class="h-captcha" 
             data-sitekey="0434871e-cc70-4460-bbb4-00e6bc7204fa" 
             data-callback="onHCaptchaVerified">
        </div>
    </div>

    <!-- Entry Execution Link -->
    <button id="entryBtn" class="btn-proceed" onclick="forwardUser()">Access Approved: Enter Site</button>
</div>

<script>
    let mcaptchaToken = "";
    let hcaptchaToken = "";

    // Initialize mCaptcha via standard JS Glue on page load
    window.addEventListener('DOMContentLoaded', () => {
        if (window.mcaptchaGlue && window.mcaptchaGlue.default) {
            const config = {
                widgetLink: new URL("https://mcaptcha.org/widget/?sitekey=tyBV0DQvnaMsiio8cKtCTKf1oT3F1ELx")
            };
            new window.mcaptchaGlue.default(config);
        }

        // Poll for mCaptcha completion token injected into #mcaptcha__token
        setInterval(() => {
            const tokenInput = document.getElementById("mcaptcha__token");
            if (tokenInput && tokenInput.value && !mcaptchaToken) {
                mcaptchaToken = tokenInput.value;
                evaluateAccessRules();
            }
        }, 500);
    });

    // Event callback for hCaptcha visual verification
    function onHCaptchaVerified(token) {
        hcaptchaToken = token;
        evaluateAccessRules();
    }

    // Verify both tokens exist before displaying proceed button
    function evaluateAccessRules() {
        if (mcaptchaToken && hcaptchaToken) {
            const entryBtn = document.getElementById("entryBtn");
            const statusMsg = document.querySelector(".status-msg");
            
            if (entryBtn) entryBtn.style.display = "block";
            if (statusMsg) {
                statusMsg.innerText = "All security challenges passed.";
                statusMsg.style.color = "#10b981";
            }
        }
    }

    function forwardUser() {
        const targetUrl = "https://hindhokla-os.netlify.app/";
        window.location.href = `${targetUrl}?m_token=${encodeURIComponent(mcaptchaToken)}&h_token=${encodeURIComponent(hcaptchaToken)}`;
    }
</script>

</body>
</html>
